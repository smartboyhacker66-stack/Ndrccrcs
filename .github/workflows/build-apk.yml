name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: >
          gradle --no-daemon assembleDebug
          -PserverHost=${{ vars.SERVER_HOST || 'bits-tandem-centre.onrender.com' }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BITS-Tandem-Centre.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BITS-Tandem-Centre-apk
          path: BITS-Tandem-Centre.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BITS Tandem Centre build ${{ github.run_number }}
          body: |
            Debug APK built from commit ${{ github.sha }}.
            Server: https://${{ vars.SERVER_HOST || 'bits-tandem-centre.onrender.com' }}
          files: BITS-Tandem-Centre.apk
          make_latest: true
