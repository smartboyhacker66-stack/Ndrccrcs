name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Accept licenses, install SDK packages, point Gradle at the SDK
        shell: bash
        run: |
          set +o pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK directory: $SDK_DIR"
          mkdir -p "$SDK_DIR/licenses"

          # 1) Write the license acceptance hashes directly.
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n601085b94cd77f0b54ff86406957099ebe79c4d6\n' > "$SDK_DIR/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK_DIR/licenses/android-sdk-preview-license"

          # 2) Accept everything else through sdkmanager.
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # 3) Make Gradle use exactly this SDK (one value everywhere, no conflicts).
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: >
          gradle --no-daemon --stacktrace --console=plain assembleDebug
          -PserverHost=${{ vars.SERVER_HOST || 'bits-tandem-centre.onrender.com' }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BITS-Tandem-Centre.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BITS-Tandem-Centre-apk
          path: BITS-Tandem-Centre.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BITS Tandem Centre build ${{ github.run_number }}
          body: |
            Debug APK built from commit ${{ github.sha }}.
            Server: https://${{ vars.SERVER_HOST || 'bits-tandem-centre.onrender.com' }}
          files: BITS-Tandem-Centre.apk
          make_latest: true

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
