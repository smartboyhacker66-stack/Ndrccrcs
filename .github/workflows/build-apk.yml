name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "Step 1: Cloning Repository"
        uses: actions/checkout@v4

      - name: "Step 2: Setting up Java JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: "Step 3: Setting up Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Step 4: Accepting Android SDK Licenses"
        run: |
          echo "Accepting all licenses..."
          yes | sdkmanager --licenses || true

      - name: "Step 5: Granting Execute Permission"
        run: chmod +x gradlew

      - name: "Step 6: Building APK with Gradle"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: "Step 7: Uploading APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: "Step 8: Final Celebration"
        run: |
          echo "=========================================="
          echo "Balle Balle! APK ban gaya bhai, party kab de raha hai?"
          echo "GitHub Actions ne bina roye code compile kar diya!"
          echo "=========================================="